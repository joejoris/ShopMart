# nginx virtual hosts for ShopMart Kenya on a single Ubuntu VPS.
# Install: cp infra/nginx.shopmart.conf /etc/nginx/sites-available/shopmart
#          ln -s /etc/nginx/sites-available/shopmart /etc/nginx/sites-enabled/shopmart
#          nginx -t && systemctl reload nginx
# Replace every occurrence of shopmart.example.co.ke with your domain.

# --- Storefront SSR (proxied to react-router serve on :3000) ---
server {
    listen 80;
    listen [::]:80;
    server_name shopmart.example.co.ke www.shopmart.example.co.ke;

    access_log /var/log/nginx/shopmart-access.log;
    error_log  /var/log/nginx/shopmart-error.log;

    client_max_body_size 10m;

    # Hashed static assets: cache aggressively
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/v1/* → NestJS API on :4000 (same-origin, so no CORS needed)
    location /api/v1/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Admin console (static vite build from /opt/shopmart-admin/dist, base = /admin/) ---
server {
    listen 80;
    listen [::]:80;
    server_name admin.shopmart.example.co.ke;

    access_log /var/log/nginx/shopmart-admin-access.log;
    error_log  /var/log/nginx/shopmart-admin-error.log;

    root /opt/shopmart-admin/dist;
    index index.html;

    # SPA fallback: every unknown path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/v1/* → NestJS API on :4000 (same-origin)
    location /api/v1/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Immutable hashed assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}

# --- If you have no domain yet (raw IP) ---
# Add a third server_name-less block, e.g. listen 8080; server_name _;
# serving the static admin build, and keep the main block above on port 80.
# TLS with certbot requires a real domain — use Cloudflare Tunnel or a
# Let's Encrypt short-lived cert if TLS matters before the domain lands.
